<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#051528" />
  <meta name="robots" content="noindex" />
  <title>GlobalFly Trade · Falta pouco</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/pwa-globalfly/favicon-32.png" />
  <link rel="apple-touch-icon" href="/pwa-globalfly/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
  <style>/* Captação da GlobalFly (26/10/2026): cadastro, questionário e obrigado.
   Manual da marca: Azul GF nas superfícies, Marfim para leitura, Aço para
   apoio, Ouro só como acento (botão com texto em Azul GF). Fonte Arimo. */
:root {
  --azul: #051528; --azul-2: #0A2038; --azul-3: #12304F;
  --marfim: #F3F0E9; --aco: #9CB1C7; --ouro: #B78D39; --ouro-claro: #D4A64A;
  --linha: rgba(156, 177, 199, .18); --erro: #F1828A;
  --raio: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--azul); color: var(--marfim);
  font: 400 16px/1.55 Arimo, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(5, 21, 40, .55) 0%, rgba(5, 21, 40, .82) 45%, var(--azul) 78%),
    url("/login-globalfly/nuvens.webp") center 30% / cover no-repeat;
}
@media (max-width: 720px) { body::before { background: linear-gradient(180deg, rgba(5,21,40,.5) 0%, rgba(5,21,40,.86) 40%, var(--azul) 70%), url("/login-globalfly/nuvens-celular.webp") center top / cover no-repeat; } }
img { max-width: 100%; display: block; }
a { color: inherit; }
button, input { font: inherit; }

.pagina { width: min(1120px, 100%); margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); display: grid; gap: 40px; min-height: 100vh; min-height: 100dvh; grid-template-rows: auto 1fr auto; }
.topo { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 8px; }
.topo img { width: 190px; height: auto; }
.passo { color: var(--aco); font-size: 13px; font-weight: 700; letter-spacing: .04em; }

/* ------------------------------------------------ cadastro */
.cadastro { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 56px; align-items: center; }
.selo-live {
  display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px 7px 10px; border: 1px solid rgba(183, 141, 57, .45); border-radius: 999px;
  background: rgba(183, 141, 57, .1); color: var(--marfim); font-size: 13.5px; font-weight: 700;
}
.selo-live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ouro-claro); box-shadow: 0 0 0 0 rgba(212, 166, 74, .6); animation: pulso 2s infinite; }
.selo-live span { color: var(--aco); font-weight: 400; }
@keyframes pulso { 70% { box-shadow: 0 0 0 8px rgba(212, 166, 74, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 166, 74, 0); } }
h1 { margin: 22px 0 16px; font-size: clamp(32px, 4.4vw, 50px); line-height: 1.08; letter-spacing: -.025em; font-weight: 700; text-wrap: balance; }
h1 em { font-style: normal; color: var(--ouro-claro); }
.chamada { margin: 0; max-width: 34em; color: #D5DCE4; font-size: 18px; }
.motivos { margin: 28px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.motivos li { display: flex; gap: 12px; align-items: flex-start; color: #D5DCE4; }
.motivos b { flex: none; display: grid; place-items: center; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; background: rgba(183, 141, 57, .16); color: var(--ouro-claro); font-size: 13px; }

.cartao {
  position: relative; padding: 30px; border: 1px solid var(--linha); border-radius: var(--raio);
  background: linear-gradient(180deg, rgba(18, 48, 79, .72), rgba(10, 32, 56, .86)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .6);
}
/* o corte diagonal do monograma, em ouro, no canto do cartão */
.cartao::before { content: ""; position: absolute; top: -1px; right: 34px; width: 46px; height: 3px; background: var(--ouro); transform: skewX(-38deg); border-radius: 2px; }
.cartao h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.01em; }
.cartao .sub { margin: 0 0 22px; color: var(--aco); font-size: 14.5px; }
.campo { display: grid; gap: 7px; margin-bottom: 16px; font-size: 14px; font-weight: 700; }
.campo input {
  width: 100%; height: 52px; padding: 0 16px; border: 1px solid rgba(156, 177, 199, .3); border-radius: 12px;
  background: rgba(5, 21, 40, .7); color: var(--marfim); font-size: 16px; font-weight: 400; transition: border-color .15s, box-shadow .15s;
}
.campo input::placeholder { color: rgba(156, 177, 199, .6); }
.campo input:focus { outline: none; border-color: var(--ouro); box-shadow: 0 0 0 3px rgba(183, 141, 57, .22); }
.campo input[aria-invalid="true"] { border-color: var(--erro); }
.campo small { color: var(--erro); font-weight: 400; font-size: 13px; min-height: 0; }
.armadilha { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

.botao {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; padding: 0 22px;
  border: 0; border-radius: 12px; background: var(--ouro); color: var(--azul); font-size: 17px; font-weight: 700; text-decoration: none;
  cursor: pointer; transition: background .15s, transform .1s;
}
.botao:hover { background: var(--ouro-claro); }
.botao:active { transform: translateY(1px); }
.botao:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.botao svg { width: 20px; height: 20px; flex: none; }
.botao:focus-visible, .opcao:has(input:focus-visible), .produto:has(input:focus-visible), a:focus-visible { outline: 2px solid var(--ouro-claro); outline-offset: 3px; }
.aviso { margin: 14px 0 0; color: var(--aco); font-size: 12.5px; line-height: 1.5; }
.mensagem { margin: 12px 0 0; font-size: 14px; }
.mensagem.erro { color: var(--erro); }
.seguro { display: flex; align-items: center; gap: 7px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--linha); color: var(--aco); font-size: 12.5px; }
.seguro svg { width: 14px; height: 14px; flex: none; }

/* ------------------------------------------------ questionário e obrigado */
.centro { display: grid; align-content: center; justify-items: center; }
.centro .cartao { width: min(600px, 100%); }
.progresso { display: grid; gap: 8px; margin-bottom: 24px; }
.progresso div { height: 4px; border-radius: 99px; background: rgba(156, 177, 199, .18); overflow: hidden; }
.progresso i { display: block; height: 100%; border-radius: inherit; background: var(--ouro); }
.progresso span { color: var(--aco); font-size: 13px; font-weight: 700; }
.pergunta { margin: 0 0 18px; padding: 0; font-weight: 700; font-size: clamp(22px, 3vw, 26px); line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
.opcoes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opcao { position: relative; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 18px; border: 1px solid rgba(156, 177, 199, .3); border-radius: 12px; background: rgba(5, 21, 40, .55); cursor: pointer; font-size: 17px; font-weight: 700; transition: border-color .15s, background .15s; }
.opcao input { position: absolute; opacity: 0; pointer-events: none; }
.opcao i { flex: none; width: 20px; height: 20px; border: 2px solid rgba(156, 177, 199, .55); border-radius: 50%; transition: all .15s; }
.opcao:hover { border-color: rgba(183, 141, 57, .6); }
.opcao:has(input:checked) { border-color: var(--ouro); background: rgba(183, 141, 57, .12); }
.opcao:has(input:checked) i { border: 6px solid var(--ouro); }
.produtos { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--linha); }
.produtos[hidden] { display: none; }
.produtos h3 { margin: 0 0 4px; font-size: 17px; }
.produtos p { margin: 0 0 14px; color: var(--aco); font-size: 14px; }
.lista-produtos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.produto { position: relative; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border: 1px solid rgba(156, 177, 199, .25); border-radius: 10px; background: rgba(5, 21, 40, .45); cursor: pointer; font-size: 15px; line-height: 1.25; transition: border-color .15s, background .15s; }
.produto input { position: absolute; opacity: 0; pointer-events: none; }
.produto i { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border: 2px solid rgba(156, 177, 199, .55); border-radius: 5px; transition: all .15s; }
.produto:has(input:checked) { border-color: var(--ouro); background: rgba(183, 141, 57, .1); }
.produto:has(input:checked) i { border-color: var(--ouro); background: var(--ouro); }
.produto:has(input:checked) i::after { content: ""; width: 10px; height: 5px; margin-top: -3px; border: solid var(--azul); border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg); }
.qual { margin-top: 10px; }
.qual[hidden] { display: none; }
.acoes { margin-top: 26px; }

.ok { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; background: rgba(183, 141, 57, .16); color: var(--ouro-claro); }
.ok svg { width: 30px; height: 30px; }
.obrigado { text-align: center; }
.obrigado h1 { margin: 0 0 12px; font-size: clamp(28px, 4vw, 38px); }
.obrigado .chamada { margin: 0 auto 26px; font-size: 17px; }
.ultimo { margin: 0 0 10px; color: var(--ouro-claro); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.live { display: flex; align-items: center; gap: 16px; margin-top: 22px; padding: 16px 18px; border: 1px solid var(--linha); border-radius: 12px; background: rgba(5, 21, 40, .5); text-align: left; }
.live .data { flex: none; display: grid; place-items: center; width: 58px; height: 62px; border-radius: 10px; background: var(--marfim); color: var(--azul); line-height: 1; }
.live .data b { font: 700 24px/1 ui-monospace, "SF Mono", Menlo, monospace; }
.live .data small { margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.live div:last-child { display: grid; gap: 2px; min-width: 0; }
.live strong { font-size: 16px; }
.live span { color: var(--aco); font-size: 14px; }
.live a { color: var(--ouro-claro); font-size: 14px; font-weight: 700; text-decoration: none; }
.live a:hover { text-decoration: underline; }
.etapas { display: flex; justify-content: center; gap: 8px; margin: 0 0 26px; padding: 0; list-style: none; flex-wrap: wrap; }
.etapas li { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; background: rgba(156, 177, 199, .1); color: var(--aco); font-size: 13px; }
.etapas li.feito { color: var(--marfim); }
.etapas li.feito::before { content: "✓"; color: var(--ouro-claro); font-weight: 700; }
.etapas li.agora { background: rgba(183, 141, 57, .16); color: var(--marfim); font-weight: 700; }

.rodape { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; padding-top: 18px; border-top: 1px solid var(--linha); color: rgba(156, 177, 199, .75); font-size: 12px; }

@media (max-width: 900px) {
  .cadastro { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .pagina { gap: 28px; }
}
@media (max-width: 520px) {
  .pagina { padding-inline: 16px; }
  .topo img { width: 150px; }
  h1 { margin-top: 18px; }
  .chamada { font-size: 16.5px; }
  .cartao { padding: 22px 18px; }
  .lista-produtos { grid-template-columns: minmax(0, 1fr); }
  .live { align-items: flex-start; }
  .so-largo { display: none; }
  .etapas { gap: 6px; }
  .etapas li { padding: 4px 9px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div class="pagina">
    <header class="topo">
      <img src="/globalfly-assinatura.png" alt="GlobalFly Trade" width="900" height="283" />
      <span class="passo">Passo 2 de 2</span>
    </header>

    <main class="centro">
      <form class="cartao" id="form" novalidate>
        <div class="progresso"><div><i style="width: 85%"></i></div><span data-ola>Falta só uma pergunta</span></div>
        <fieldset style="border: 0; margin: 0; padding: 0; min-width: 0">
          <legend class="pergunta">Você já foi cliente do ecossistema do Victor Cordeiro?</legend>
          <div class="opcoes">
            <label class="opcao"><input type="radio" name="cliente" value="sim" id="cliente-sim" /><i></i>Sim</label>
            <label class="opcao"><input type="radio" name="cliente" value="nao" id="cliente-nao" /><i></i>Não</label>
          </div>
        </fieldset>

        <fieldset class="produtos" id="produtos" hidden style="border-left: 0; border-right: 0; border-bottom: 0; margin: 0; padding-left: 0; padding-right: 0; min-width: 0">
          <h3>De quais produtos você já foi cliente?</h3>
          <p>Marque todos que se aplicam.</p>
          <div class="lista-produtos">
            <label class="produto"><input type="checkbox" name="produto" value="b3" id="p-b3" /><i></i>B3</label>
            <label class="produto"><input type="checkbox" name="produto" value="fast" id="p-fast" /><i></i>Universidade Trading (Fast)</label>
            <label class="produto"><input type="checkbox" name="produto" value="calculadora_fast" id="p-calculadora" /><i></i>Calculadora Fast</label>
            <label class="produto"><input type="checkbox" name="produto" value="stark" id="p-stark" /><i></i>Stark / Starkbot</label>
            <label class="produto"><input type="checkbox" name="produto" value="plano_socio" id="p-socio" /><i></i>Plano Sócio</label>
            <label class="produto"><input type="checkbox" name="produto" value="mentoria" id="p-mentoria" /><i></i>Mentoria</label>
            <label class="produto"><input type="checkbox" name="produto" value="grande_revolucao" id="p-revolucao" /><i></i>A Grande Revolução</label>
            <label class="produto"><input type="checkbox" name="produto" value="outro" id="p-outro" /><i></i>Outro</label>
          </div>
          <label class="campo qual" id="qual" hidden>Qual?
            <input id="outro" name="outro" maxlength="60" placeholder="Nome do produto" autocomplete="off" />
          </label>
        </fieldset>

        <div class="acoes">
          <button class="botao" type="submit" disabled>Concluir cadastro <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          <p class="mensagem" role="status" aria-live="polite"></p>
        </div>
      </form>
    </main>

    <footer class="rodape">
      <span>© 2026 GlobalFly Trade</span>
      <span>Operar envolve risco de perda. Resultados passados não garantem resultados futuros.</span>
    </footer>
  </div>

  <script>/* Captação da GlobalFly: o que as três páginas dividem. */
var GF = (function () {
  // O cadastro vai para o motor (ele grava com a chave do servidor). O
  // questionário só completa essa linha, por uma função do banco que aceita a
  // chave pública: a mesma de src/core/teeds/config.ts, que já vai no site.
  var MOTOR = 'https://motor.globalflytrade.com/publico/leads'
  var SUPABASE = 'https://wonxykovfvfnuhzpqsle.supabase.co'
  var CHAVE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indvbnh5a292ZnZmbnVoenBxc2xlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDU3MTgsImV4cCI6MjEwMzc4MTcxOH0.5n9ePaGLNMOHOzitZULblGCsTj3ORJDgsWvc17V_0PU'
  // A comunidade oficial (src/marca/marcas.ts, `comunidade`)
  var COMUNIDADE = 'https://chat.whatsapp.com/CPBJlfpTpZy7u2N5VF9Drq'
  var CHAVE_LOCAL = 'gf-captacao'

  // sessionStorage some quando o navegador do Instagram troca de aba: guarda nos dois
  function ler() {
    var bruto = null
    try { bruto = sessionStorage.getItem(CHAVE_LOCAL) } catch (e) {}
    if (!bruto) try { bruto = localStorage.getItem(CHAVE_LOCAL) } catch (e) {}
    try { return bruto ? JSON.parse(bruto) : {} } catch (e) { return {} }
  }
  function guardar(dados) {
    var tudo = Object.assign(ler(), dados), texto = JSON.stringify(tudo)
    try { sessionStorage.setItem(CHAVE_LOCAL, texto) } catch (e) {}
    try { localStorage.setItem(CHAVE_LOCAL, texto) } catch (e) {}
    return tudo
  }

  // Parceiro de divulgação (27/10/2026): o mesmo guardado pelo site (src/core/teeds/parceiro.ts,
  // chave globalfly.parceiro, 90 dias, primeiro toque). Vai na FRENTE do endereço gravado: o
  // servidor guarda só 300 caracteres. A regra que vale é a do banco.
  var PARCEIROS = ['n', 'v'], CHAVE_PARCEIRO = 'globalfly.parceiro'
  function parceiro() {
    try {
      var g = JSON.parse(localStorage.getItem(CHAVE_PARCEIRO) || 'null')
      if (g && PARCEIROS.indexOf(g.codigo) >= 0 && Date.now() - g.em < 90 * 864e5) return g.codigo
    } catch (e) {}
    var daqui = (new URLSearchParams(location.search).get('parceiro') || '').toLowerCase()
    if (PARCEIROS.indexOf(daqui) >= 0) { try { localStorage.setItem(CHAVE_PARCEIRO, JSON.stringify({ codigo: daqui, em: Date.now() })) } catch (e) {} return daqui }
    return null
  }
  // O clique no link do parceiro conta no funil dele (um por navegador, por dia), como no site.
  ;(function anotarClique() {
    var q = new URLSearchParams(location.search), codigo = (q.get('parceiro') || '').toLowerCase()
    if (PARCEIROS.indexOf(codigo) < 0) return
    var visitante = null
    try { visitante = JSON.parse(localStorage.getItem('globalfly.visitante') || 'null') } catch (e) {}
    if (!visitante || !/^[a-zA-Z0-9]{8,40}$/.test(visitante)) {
      visitante = (Date.now().toString(36) + Math.random().toString(36).slice(2, 14)).replace(/[^a-zA-Z0-9]/g, '')
      try { localStorage.setItem('globalfly.visitante', JSON.stringify(visitante)) } catch (e) {}
    }
    try {
      fetch(SUPABASE + '/rest/v1/rpc/teeds_toque_parceiro', {
        method: 'POST', keepalive: true,
        headers: { apikey: CHAVE, Authorization: 'Bearer ' + CHAVE, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_marca: 'globalfly', p_codigo: codigo, p_visitante: visitante, p_link: (q.get('utm_source') || 'pagina-do-lancamento').slice(0, 60) }),
      }).catch(function () {})
    } catch (e) {}
    parceiro()
  })()
  function paginaComParceiro() {
    var p = parceiro(), aqui = new URL(location.href)
    if (!p) return aqui.href
    var nova = new URL(aqui.origin + aqui.pathname)
    nova.searchParams.set('parceiro', p)
    aqui.searchParams.forEach(function (v, k) { if (k !== 'parceiro') nova.searchParams.append(k, v) })
    return nova.href
  }

  // As marcações da campanha (utm) seguem de página em página
  function proxima(caminho) {
    var destino = new URL(caminho, location.href), aqui = new URLSearchParams(location.search)
    aqui.forEach(function (valor, chave) { if (/^(utm_|fbclid|gclid|src|sck)/.test(chave)) destino.searchParams.set(chave, valor) })
    return destino.toString()
  }

  return { MOTOR: MOTOR, SUPABASE: SUPABASE, CHAVE: CHAVE, COMUNIDADE: COMUNIDADE, ler: ler, guardar: guardar, proxima: proxima, paginaComParceiro: paginaComParceiro }
})()
</script>
  <script>
    (function () {
      var dados = GF.ler()
      // Sem o cadastro (abriu o link direto), volta para o passo 1
      if (!dados.email) { location.replace(GF.proxima('../')); return }
      if (dados.nome) document.querySelector('[data-ola]').textContent = dados.nome + ', falta só uma pergunta'

      var form = document.getElementById('form'), botao = form.querySelector('.botao'), mensagem = form.querySelector('.mensagem')
      var produtos = document.getElementById('produtos'), qual = document.getElementById('qual')

      function resposta() { var r = form.querySelector('input[name="cliente"]:checked'); return r ? r.value : null }
      function marcados() { return Array.prototype.map.call(form.querySelectorAll('input[name="produto"]:checked'), function (c) { return c.value }) }
      function atualizar() {
        var r = resposta(), lista = marcados()
        produtos.hidden = r !== 'sim'
        qual.hidden = lista.indexOf('outro') < 0
        botao.disabled = !r || (r === 'sim' && lista.length === 0)
      }
      form.addEventListener('change', function (ev) {
        atualizar()
        if (ev.target.id === 'cliente-sim') produtos.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
        if (ev.target.id === 'p-outro' && ev.target.checked) document.getElementById('outro').focus()
      })

      form.addEventListener('submit', function (ev) {
        ev.preventDefault()
        var r = resposta(); if (!r || botao.disabled) return
        var lista = r === 'sim' ? marcados() : []
        botao.disabled = true; botao.textContent = 'Enviando…'; mensagem.textContent = ''
        var seguir = function () { GF.guardar({ respondeu: true }); location.assign(GF.proxima('../obrigado/')) }
        fetch(GF.SUPABASE + '/rest/v1/rpc/gf_responder_questionario', {
          method: 'POST',
          headers: { 'content-type': 'application/json', apikey: GF.CHAVE, authorization: 'Bearer ' + GF.CHAVE },
          body: JSON.stringify({ p_email: dados.email, p_ex_cliente: r === 'sim', p_produtos: lista, p_outro: document.getElementById('outro').value || null }),
        })
          // O cadastro já está garantido no passo 1: se a resposta não gravar, a pessoa segue mesmo assim
          .then(seguir, seguir)
      })
    })()
  </script>
</body>
